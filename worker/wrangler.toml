name = "crazycards-checkout"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Created with: npx wrangler kv namespace create SALES   (paste the id it prints)
kv_namespaces = [
  { binding = "SALES", id = "420a69ec121649348a69aa39226c0ce7" }
]

[vars]
SITE_ORIGIN = "https://getcrazycards.com"
INVENTORY_URL = "https://raw.githubusercontent.com/ckline540/getcrazycards/main/inventory.json"
# Shipping: flat rate in cents, free at or above FREE_SHIPPING_OVER_CENTS (0 = never free).
SHIPPING_CENTS = "499"
FREE_SHIPPING_OVER_CENTS = "5000"
SHIPPING_LABEL = "USPS tracked (bubble mailer)"
ALLOWED_COUNTRIES = "US"

# Secrets (never in this file). Set with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
